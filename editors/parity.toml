[zed]
"dbt.showLineage" = { via = "code lens and code action 'Column lineage' (a window/showMessage)", sent_in = "crates/cogitator-analysis/src/features/lenses.rs" }
"dbt.run" = { via = "code lens and code action 'dbt run' (notifications)", sent_in = "crates/cogitator-analysis/src/features/lenses.rs" }
"dbt.test" = { via = "code lens and code action 'dbt test' (notifications)", sent_in = "crates/cogitator-analysis/src/features/lenses.rs" }
"dbt.compile" = { via = "code lens and code action 'dbt compile' (notifications)", sent_in = "crates/cogitator-analysis/src/features/lenses.rs" }
"dbt.extractModelYaml" = { via = "code lens and code action 'Extract schema YAML'", sent_in = "crates/cogitator-analysis/src/features/lenses.rs" }
"dbt.setTarget" = { via = "code action 'Switch target' in the active profiles.yml", sent_in = "crates/cogitator-analysis/src/features/code_actions/mod.rs" }
"dbt.incrementalDiff" = { via = "code lens 'Compare incremental / full refresh' (show: true opens the diff)", sent_in = "crates/cogitator-analysis/src/features/incremental_diff.rs" }
"dbt.columnLineageGraph" = { via = "code action 'Show column lineage of m.col' (show: true opens the walk as a file)", sent_in = "crates/cogitator-analysis/src/features/lineage_graph/action.rs" }
"dbt.renameColumn" = { via = "textDocument/rename, up- and downstream with initializationOptions.renameColumnDirection \"both\"" }

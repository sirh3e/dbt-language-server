# Consumer parity (crates/cogitator-lsp/tests/consumer_parity.rs, the editor-parity skill).
#
# Every dbt.* command the server registers (cogitator_lsp::COMMANDS) is classified here:
#   kind = "user"      a person runs it, so every editor exposes it: nvim, emacs and vscode
#                      wrap it; Zed, which has no command surface, reaches it through the
#                      server's dialogs (crates/cogitator/src/server/dialogs/menu.rs, the
#                      "dbt…" code action).
#   kind = "internal"  the server sends it inside a code lens or code action, which every
#                      LSP client runs by itself; `via` says where.
#
# [gaps.<editor>] lists the user commands an editor did not wrap when the rule was adopted
# (2026-11-22; Zed's dialogs 2026-11-27). It only shrinks: a new command never gets a line here, and the test fails
# once an editor wraps a listed command until its line is removed.

[commands]
"dbt.goToSchema" = { kind = "user" }
"dbt.columnLineage" = { kind = "user" }
"dbt.openSchema" = { kind = "internal", via = "code lens and code action 'Go to schema' (features/lenses.rs, code_actions/mod.rs)" }
"dbt.showLineage" = { kind = "user" }
"dbt.run" = { kind = "user" }
"dbt.test" = { kind = "user" }
"dbt.compile" = { kind = "user" }
"dbt.modelGraph" = { kind = "user" }
"dbt.profiles" = { kind = "user" }
"dbt.setTarget" = { kind = "user" }
"dbt.extractModelYaml" = { kind = "user" }
"dbt.modelTests" = { kind = "user" }
"dbt.goToTests" = { kind = "internal", via = "code lens 'N tests' and its code action (features/lenses.rs, code_actions/mod.rs)" }
"dbt.status" = { kind = "user" }
"dbt.projectGraph" = { kind = "user" }
"dbt.modelInfo" = { kind = "user" }
"dbt.relation" = { kind = "user" }
"dbt.compiledSql" = { kind = "user" }
"dbt.parse" = { kind = "user" }
"dbt.openModel" = { kind = "internal", via = "code action 'Open model' (cogitator-analysis features/code_actions/mod.rs)" }
"dbt.setProfilesDir" = { kind = "user" }
"dbt.cache" = { kind = "user" }
"dbt.reloadConfig" = { kind = "user" }
"dbt.sourceFreshness" = { kind = "user" }
"dbt.cancel" = { kind = "user" }
"dbt.runSelection" = { kind = "user" }
"dbt.deadModels" = { kind = "user" }
"dbt.impact" = { kind = "user" }
"dbt.expandJinja" = { kind = "user" }
"dbt.doctor" = { kind = "user" }
"dbt.preview" = { kind = "user" }
"dbt.queryPlan" = { kind = "user" }
"dbt.deps" = { kind = "internal", via = "code action 'Run dbt deps' for a missing package (code_actions/mod.rs)" }
"dbt.incrementality" = { kind = "user" }
"dbt.splitPlan" = { kind = "user" }
"dbt.incrementalDiff" = { kind = "user" }
"dbt.testSql" = { kind = "user" }
"dbt.incrementalSql" = { kind = "user" }
"dbt.cteSql" = { kind = "user" }
"dbt.syntaxTree" = { kind = "user" }
"dbt.highlight" = { kind = "user" }
"dbt.astGrep" = { kind = "user" }
"dbt.nodeInfo" = { kind = "user" }
"dbt.unresolved" = { kind = "user" }
"dbt.breakingChanges" = { kind = "user" }
"dbt.previewCte" = { kind = "user" }
"dbt.select" = { kind = "user" }
"dbt.lineageSite" = { kind = "user" }
"dbt.syncYaml" = { kind = "user" }
"dbt.modelDependencies" = { kind = "user" }
"dbt.menu" = { kind = "internal", via = "code action 'dbt… (every dbt command)' when initializationOptions.dialogs (the Zed extension; server/dialogs)" }


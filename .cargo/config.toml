# mold as the dev/test linker on Linux (specs/rust-port/09 §3).
# Release cross-builds go through cargo-zigbuild and are unaffected.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

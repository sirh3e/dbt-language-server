[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://codeberg.org/sirh3e/dbt-language-server"

[workspace.dependencies]
# internal crates
dbt-ls-error = { path = "crates/dbt-ls-error" }
dbt-ls-lsp = { path = "crates/dbt-ls-lsp" }
dbt-ls-dialects = { path = "crates/dbt-ls-dialects" }
dbt-ls-schemas = { path = "crates/dbt-ls-schemas" }
dbt-ls-parser = { path = "crates/dbt-ls-parser" }
dbt-ls-analysis = { path = "crates/dbt-ls-analysis" }
dbt-ls-duckdb = { path = "crates/dbt-ls-duckdb" }

# external (05 §1)
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
sqlparser = "0.52"
minijinja = { version = "2", features = ["unstable_machinery"] }
petgraph = "0.6"
saphyr = "0.3"
tokio = { version = "1", features = [
    "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "macros", "fs", "tracing",
] }
walkdir = "2"

# observability (05 §6.3)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
console-subscriber = "0.4"

# dev
insta = { version = "1", features = ["json"] }
rstest = "0.23"
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://codeberg.org/sirh3e/cogitator"

[workspace.dependencies]
# internal crates
heresy = { path = "crates/heresy" }
vox = { path = "crates/vox" }
lexicanum = { path = "crates/lexicanum" }
codex = { path = "crates/codex" }
lexmechanic = { path = "crates/lexmechanic" }
magos = { path = "crates/magos" }
servitor = { path = "crates/servitor" }

# external (05 §1)
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
sqlparser = "0.63"
minijinja = { version = "3", features = ["unstable_machinery"] }
petgraph = "0.8"
saphyr = "0.3"
typify = "0.8"      # compile-time import_types! for the dbt schemas (08 §2.2)
tokio = { version = "1", features = [
    "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "macros", "fs", "tracing",
] }
walkdir = "2"

# observability (05 §6.3)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
console-subscriber = "0.5"

# dev
insta = { version = "1", features = ["json"] }
rstest = "0.28"
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1

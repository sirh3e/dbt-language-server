[workspace]
resolver = "2"
members = ["crates/*"]
# fuzz is its own workspace: cargo-fuzz builds it with nightly +
# sanitizer flags that must never leak into ordinary builds
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://codeberg.org/sirh3e/cogitator"

[workspace.dependencies]
# internal crates
cogitator-error = { path = "crates/cogitator-error" }
cogitator-lsp = { path = "crates/cogitator-lsp" }
cogitator-dialects = { path = "crates/cogitator-dialects" }
cogitator-schemas = { path = "crates/cogitator-schemas" }
cogitator-parser = { path = "crates/cogitator-parser" }
cogitator-analysis = { path = "crates/cogitator-analysis" }
cogitator-duckdb = { path = "crates/cogitator-duckdb" }
cogitator-treesitter = { path = "crates/cogitator-treesitter" }
cogitator-ir = { path = "crates/cogitator-ir" }
cogitator-sql-front = { path = "crates/cogitator-sql-front" }
cogitator-lower = { path = "crates/cogitator-lower" }
cogitator-rules = { path = "crates/cogitator-rules" }

# external (05 §1)
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
sqlparser = "0.63"
sqlformat = "0.3"   # textDocument/formatting engine (05 §9)
minijinja = { version = "3", features = ["unstable_machinery"] }
petgraph = "0.8"
saphyr = "0.3"
typify = "0.8"      # compile-time import_types! for the dbt schemas (08 §2.2)
tokio = { version = "1", features = [
    "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "macros", "fs", "tracing",
] }
walkdir = "2"
tree-sitter = "0.27"           # C runtime bindings (06 §3.2)
tree-sitter-language = "0.1"
cc = "1"

# observability (05 §6.3)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics"] }
console-subscriber = "0.5"

# dev
criterion = "0.5"   # benches (09 §5): parser pipeline + column lineage
insta = { version = "1", features = ["json"] }
rstest = "0.28"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

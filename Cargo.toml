[workspace]
resolver = "2"
members = ["crates/*"]
# fuzz is its own workspace: cargo-fuzz builds it with nightly +
# sanitizer flags that must never leak into ordinary builds.
# oracles/datafusion is its own workspace too: datafusion pins arrow and
# sqlparser versions this lockfile moved past (specs/ir-pipeline/07)
# vendor/sqlfluffrs is its own workspace too: vendored as generated (update.sh)
exclude = ["fuzz", "oracles/datafusion", "vendor/sqlfluffrs"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://codeberg.org/sirh3e/cogitator"

[workspace.dependencies]
# internal crates
cogitator-error = { path = "crates/cogitator-error" }
cogitator-lsp = { path = "crates/cogitator-lsp" }
cogitator-dialects = { path = "crates/cogitator-dialects" }
cogitator-schemas = { path = "crates/cogitator-schemas" }
cogitator-parser = { path = "crates/cogitator-parser" }
cogitator-analysis = { path = "crates/cogitator-analysis" }
cogitator-duckdb = { path = "crates/cogitator-duckdb" }
cogitator-treesitter = { path = "crates/cogitator-treesitter" }
cogitator-astgrep = { path = "crates/cogitator-astgrep" }
cogitator-ir = { path = "crates/cogitator-ir" }
cogitator-sql-front = { path = "crates/cogitator-sql-front" }
cogitator-lower = { path = "crates/cogitator-lower" }
cogitator-rules = { path = "crates/cogitator-rules" }
cogitator-format = { path = "crates/cogitator-format" }

# sqlfluff's Rust lexer and parser, vendored with their generated dialects
# (vendor/sqlfluffrs/update.sh; not on crates.io, generated by Python upstream)
sqlfluffrs_types = { path = "vendor/sqlfluffrs/sqlfluffrs_types" }
sqlfluffrs_dialects = { path = "vendor/sqlfluffrs/sqlfluffrs_dialects" }
sqlfluffrs_lexer = { path = "vendor/sqlfluffrs/sqlfluffrs_lexer" }
sqlfluffrs_parser = { path = "vendor/sqlfluffrs/sqlfluffrs_parser" }

# external (05 §1)
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
sqlparser = "0.63"
sqlformat = "0.3"   # textDocument/formatting engine (05 §9)
minijinja = { version = "3", features = ["unstable_machinery"] }
petgraph = "0.8"
similar = "2.7"     # dbt.incrementalDiff unified diffs
saphyr = "0.3"
# dbt's YAML and artifact schemas as Rust types, shared with other dbt tools
dbt-schemas = { git = "https://github.com/sirh3e/dbt-schemas", tag = "v0.1.1" }
tokio = { version = "1", features = [
    "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "macros", "fs", "tracing",
] }
walkdir = "2"
toml = "1"
tree-sitter = "0.27"           # C runtime bindings (06 §3.2)
tree-sitter-highlight = "0.27"  # highlights.scm with injections, for dbt.highlight
tree-sitter-sequel = "0.3"
tree-sitter-yaml = "0.7"   # YAML property files, for dbt.highlight
ast-grep-core = "0.51"   # structural search over tree-sitter-dbt (dbt.astGrep)
ast-grep-config = "0.51"
# Jinja over SQL; its own repository so others can use it without this server
tree-sitter-dbt = { git = "https://github.com/sirh3e/tree-sitter-dbt", rev = "ca6ce2d5dec7a8958f2a160637bd2bafa1fcfb98" }

# observability (05 §6.3)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics"] }
console-subscriber = "0.5"

# dev
criterion = "0.5"   # benches (09 §5): parser pipeline + column lineage
insta = { version = "1", features = ["json"] }
rstest = "0.28"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

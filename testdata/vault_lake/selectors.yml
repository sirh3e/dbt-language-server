selectors:
  - name: marts_without_tests
    description: The marts, and none of their tests.
    definition:
      union:
        - method: tag
          value: mart
        - exclude:
            - method: resource_type
              value: test
            - method: resource_type
              value: unit_test
  - name: raw_layer
    definition: "tag:raw"
  - name: what_dim_items_reads
    definition:
      method: fqn
      value: dim_items
      parents: true

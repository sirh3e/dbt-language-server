[package]
name = "sqlfluffrs_lexer"
version.workspace = true
edition = "2021"
rust-version.workspace = true

[dependencies]
hashbrown.workspace = true
log.workspace = true
itertools.workspace = true
uuid.workspace = true
sqlfluffrs_types = { path = "../sqlfluffrs_types" }
sqlfluffrs_dialects = { path = "../sqlfluffrs_dialects" }

[features]
unicode = []

[lints.rust]
# the PyO3 bridge (feature "python") is not vendored, and what only it
# used is dead here; upstream's code is not ours to change
unexpected_cfgs = "allow"
dead_code = "allow"

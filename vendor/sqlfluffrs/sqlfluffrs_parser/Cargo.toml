[package]
name = "sqlfluffrs_parser"
version.workspace = true
edition = "2021"
rust-version.workspace = true

[dependencies]
log.workspace = true
hashbrown.workspace = true
smallvec.workspace = true
sqlfluffrs_types = { path = "../sqlfluffrs_types" }
sqlfluffrs_dialects = { path = "../sqlfluffrs_dialects" }
sqlfluffrs_lexer = { path = "../sqlfluffrs_lexer" }
uuid.workspace = true
serde_yaml_ng.workspace = true

[features]
verbose-debug = []

[lints.rust]
# the PyO3 bridge (feature "python") is not vendored, and what only it
# used is dead here; upstream's code is not ours to change
unexpected_cfgs = "allow"
dead_code = "allow"

name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: {}  # dry-run: builds the matrix without creating a release

permissions:
  contents: write  # Required to create releases

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-gnu

      - name: Setup Zig (C/C++ toolchain + cross linker, specs/rust-port/07 §5)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes (same style as CHANGELOG.md)
        id: changelog
        run: |
          {
            echo "CHANGELOG<<EOF"
            git cliff --latest --strip header
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release binaries (cargo-zigbuild, 07 §5 matrix)
        run: |
          mkdir -p dist
          # target triple -> asset suffix install.sh / install.ps1 download
          build() {
            local target="$1" suffix="$2" ext="${3:-}"
            cargo zigbuild --release --target "$target" -p cogitator
            cp "target/${target%%.*}/release/cogitator$ext" "dist/cogitator-$suffix"
          }
          build x86_64-unknown-linux-gnu.2.17 linux-amd64
          build x86_64-apple-darwin darwin-amd64
          build aarch64-apple-darwin darwin-arm64
          build x86_64-pc-windows-gnu windows-amd64.exe .exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.VERSION }} \
            --title "${{ steps.version.outputs.VERSION }}" \
            --notes "${{ steps.changelog.outputs.CHANGELOG }}"

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in ./dist/*; do
            if [ -f "$asset" ]; then
              echo "Uploading $asset"
              gh release upload ${{ steps.version.outputs.VERSION }} "$asset" --clobber
            fi
          done

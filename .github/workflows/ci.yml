name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  # Builds are expensive: run them only when the Rust/C side (or what its
  # tests depend on) changed. Docs- and editor-only pushes skip the matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      editors: ${{ steps.filter.outputs.editors }}
      shell: ${{ steps.filter.outputs.shell }}
      nix: ${{ steps.filter.outputs.nix }}
      oracle: ${{ steps.filter.outputs.oracle }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'schemas/**'
              - 'testdata/**'
              - '.cargo/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            editors:
              - 'editors/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'testdata/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
              - '**/*.bash'
            nix:
              - '**/*.nix'
              - 'devenv.yaml'
              - '.envrc'
            oracle:
              - 'crates/cogitator-duckdb/**'
              - 'crates/cogitator-oracle/**'
              - 'crates/cogitator-ir/**'
              - 'crates/cogitator-sql-front/**'
              - 'crates/cogitator-lower/**'
              - 'crates/cogitator-rules/**'
              - 'oracles/**'
              - 'testdata/oracle/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold (the linker .cargo/config.toml selects on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - uses: Swatinem/rust-cache@v2

      - name: Test
        # the e2e feature builds the fake-dbt test bin (job e2e tests)
        run: cargo test --workspace --features cogitator/e2e

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold (the linker .cargo/config.toml selects on Linux)
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Format the isolated DataFusion oracle (not a workspace member)
        run: cargo fmt --manifest-path oracles/datafusion/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features cogitator/e2e -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Generated schemas are fresh
        run: just gen-schemas-check


  # The engine oracles (specs/ir-pipeline/07): the differential corpus
  # against DuckDB and DataFusion. Neither engine is in the default build,
  # so this is the only job that compiles them. DuckDB's C++ goes through
  # Zig (rust-port/07 §5) via cargo-zigbuild, which also links with Zig:
  # `zig c++` objects need its libc++, which a plain clang link would not
  # find. DataFusion is pure Rust.
  oracle:
    name: oracle (ubuntu)
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold (the linker .cargo/config.toml selects on Linux)
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Setup Zig (C/C++ toolchain, same pin as release.yml)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            oracles/datafusion

      - name: Format the isolated DataFusion oracle
        run: cargo fmt --manifest-path oracles/datafusion/Cargo.toml --check

      - name: Lint the isolated DataFusion oracle
        run: cargo clippy --manifest-path oracles/datafusion/Cargo.toml --all-targets --locked -- -D warnings

      - name: DuckDB oracle
        run: cargo-zigbuild test -p cogitator-oracle --features duckdb-oracle --target x86_64-unknown-linux-gnu --locked

      - name: DataFusion oracle
        run: cargo test --manifest-path oracles/datafusion/Cargo.toml --locked

  # The editor system suites (specs/neovim-plugin §8): headless Neovim,
  # batch Emacs and the VS Code extension host through the
  # system_editors orchestrator, which fails on a missing editor here
  # (COGITATOR_REQUIRE_EDITORS) instead of skipping — CI can never go
  # silently green. xvfb gives the downloaded VS Code its display.
  editors:
    name: editors (ubuntu)
    needs: changes
    if: needs.changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold (the linker .cargo/config.toml selects on Linux), Emacs and xvfb
        run: sudo apt-get update && sudo apt-get install -y mold clang emacs-nox xvfb

      - name: Install Neovim (stable >= 0.11)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - uses: Swatinem/rust-cache@v2

      - name: Editor system suites
        run: xvfb-run -a cargo test -p cogitator --features e2e --test system_editors -- --ignored --nocapture
        env:
          COGITATOR_REQUIRE_EDITORS: "1"

  shellcheck:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck (testdata fixture is third-party)
        run: git ls-files '*.sh' '*.bash' | grep -v '^testdata/' | xargs -r shellcheck

  # Proves shell.nix evaluates and the dev environment assembles.
  # (devenv itself is not exercised here to keep the job light.)
  nix-shell:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Enter the dev shell and check the toolchain
        run: |
          nix-shell --run '
            cargo --version &&
            rustfmt --version &&
            just --version &&
            shellcheck --version &&
            git-cliff --version &&
            python3 --version &&
            nvim --version | head -1 &&
            emacs --version | head -1
          '

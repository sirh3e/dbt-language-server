[package]
name = "cogitator"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cogitator"
path = "src/main.rs"

[features]
default = []
duckdb-parser = ["cogitator-duckdb/duckdb-parser"]
tokio-console = ["dep:console-subscriber"]

[dependencies]
cogitator-error = { workspace = true }
cogitator-lsp = { workspace = true }
cogitator-dialects = { workspace = true }
cogitator-analysis = { workspace = true }
cogitator-parser = { workspace = true }
cogitator-duckdb = { workspace = true }
cogitator-treesitter = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
console-subscriber = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }

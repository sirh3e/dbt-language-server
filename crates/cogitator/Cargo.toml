[package]
name = "cogitator"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cogitator"
path = "src/main.rs"

# Test-only stand-in for the dbt CLI (05 §7): built when the `e2e`
# feature is on, which `just test`/`check` and CI always pass. Never
# part of release artifacts.
[[bin]]
name = "fake-dbt"
path = "src/bin/fake_dbt.rs"
required-features = ["e2e"]

[features]
default = []
duckdb-parser = ["cogitator-duckdb/duckdb-parser"]
tokio-console = ["dep:console-subscriber"]
# enables the fake-dbt bin + the e2e tests that script it; no effect
# on the shipped cogitator binary
e2e = []

[dependencies]
cogitator-error = { workspace = true }
cogitator-schemas = { workspace = true }
saphyr = { workspace = true }
cogitator-lsp = { workspace = true }
cogitator-dialects = { workspace = true }
cogitator-analysis = { workspace = true }
cogitator-parser = { workspace = true }
cogitator-duckdb = { workspace = true }
cogitator-treesitter = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
console-subscriber = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[package]
name = "cogitator-duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# DuckDB 2.0 parse diagnostics (specs/rust-port/07). Off by default so the
# bundled C++ build stays out of the dev inner loop (09 §1).
duckdb-parser = ["dep:duckdb"]

[dependencies]
cogitator-error = { workspace = true }
cogitator-lsp = { workspace = true }
cogitator-parser = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# crate version 1.20000.x bundles the DuckDB 2.0 engine (new PEG parser)
duckdb = { version = "1.20000", features = ["bundled", "json"], optional = true }

[dev-dependencies]
cogitator-dialects = { workspace = true }

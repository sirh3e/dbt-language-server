[package]
name = "dbt-language-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dbt-language-server"
path = "src/main.rs"

[features]
default = []
duckdb-parser = ["dbt-ls-duckdb/duckdb-parser"]
tokio-console = ["dep:console-subscriber"]

[dependencies]
dbt-ls-error = { workspace = true }
dbt-ls-lsp = { workspace = true }
dbt-ls-dialects = { workspace = true }
dbt-ls-analysis = { workspace = true }
dbt-ls-parser = { workspace = true }
dbt-ls-duckdb = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
console-subscriber = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }
